<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#18181b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#09090b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Glowing decorative blobs -->
  <circle cx="1100" cy="100" r="250" fill="#0d9488" opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="500" r="200" fill="#059669" opacity="0.08" filter="url(#glow)" />
  
  <!-- Content Container -->
  <g transform="translate(100, 150)">
    <!-- Subtitle / Tag -->
    <text x="0" y="40" fill="#2dd4bf" font-family="'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="4">PORTFOLIO &amp; RESUME</text>
    
    <!-- Title / Name -->
    <text x="0" y="130" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="76" font-weight="900" letter-spacing="-1">K. Aman Sagar</text>
    
    <!-- Role -->
    <text x="0" y="200" fill="url(#textGrad)" font-family="'Inter', sans-serif" font-size="34" font-weight="700">Full Stack MERN &amp; PHP Developer</text>
    
    <!-- Description -->
    <text x="0" y="270" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="20" font-weight="400" width="700">
      <tspan x="0" dy="0">Specializing in building CRM systems, RBAC, performance optimization,</tspan>
      <tspan x="0" dy="30">and intelligent AI integrations using React, Next.js, Node.js, PHP, and MongoDB.</tspan>
    </text>
    
    <!-- Key tech tags -->
    <g transform="translate(0, 360)">
      <!-- Tech Badge 1 -->
      <rect x="0" y="0" width="130" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="65" y="26" fill="#e4e4e7" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">React / Next.js</text>
      
      <!-- Tech Badge 2 -->
      <rect x="145" y="0" width="100" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="195" y="26" fill="#e4e4e7" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Node.js</text>
      
      <!-- Tech Badge 3 -->
      <rect x="260" y="0" width="90" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="305" y="26" fill="#e4e4e7" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">PHP</text>
      
      <!-- Tech Badge 4 -->
      <rect x="365" y="0" width="110" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="420" y="26" fill="#e4e4e7" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">MongoDB</text>
      
      <!-- Tech Badge 5 -->
      <rect x="490" y="0" width="140" height="42" rx="21" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="560" y="26" fill="#e4e4e7" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">AI Integrations</text>
    </g>
  </g>
  
  <!-- Right decorative element (stylized hexagon or code container) -->
  <g transform="translate(850, 240)">
    <polygon points="100,0 200,58 200,173 100,231 0,173 0,58" fill="none" stroke="url(#textGrad)" stroke-width="4" stroke-opacity="0.5" />
    <path d="M 60,80 L 35,115 L 60,150 M 140,80 L 165,115 L 140,150 M 120,70 L 80,160" fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
